name: Add financial analysis menu icons

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add menu icons
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/analytics/page.tsx')
          s = p.read_text()
          old_import = 'import { Menu, X, ArrowDownLeft, ArrowUpRight, BarChart3, ChevronRight, Loader2, ShieldCheck, Sparkles, TrendingUp, Upload, Wallet, Landmark } from "lucide-react";'
          new_import = 'import { Menu, X, ArrowDownLeft, ArrowUpRight, BarChart3, ChevronRight, Loader2, ShieldCheck, Sparkles, TrendingUp, Upload, Wallet, Landmark, Activity, FileText, CalendarDays, Users, Store, Repeat2 } from "lucide-react";'
          if old_import in s:
              s = s.replace(old_import, new_import, 1)
          old_tabs = 'const tabs=["Overview","Monthly","Income","People","Expenses","Categories","Merchants","Recurring"] as const;type Tab=typeof tabs[number];type Bank="OPay"|"PalmPay";'
          new_tabs = 'const tabs=["Overview","Monthly","Income","People","Expenses","Categories","Merchants","Recurring"] as const;type Tab=typeof tabs[number];type Bank="OPay"|"PalmPay";const navIcon:Record<Tab,React.ReactNode>={Overview:<Activity/>,Monthly:<CalendarDays/>,Income:<ArrowDownLeft/>,People:<Users/>,Expenses:<ArrowUpRight/>,Categories:<BarChart3/>,Merchants:<Store/>,Recurring:<Repeat2/>};'
          if old_tabs in s:
              s = s.replace(old_tabs, new_tabs, 1)
          old_menu = '{tabs.map(t=><button className={tab===t?"active":""} onClick={()=>choose(t)} key={t}>{t}<ChevronRight size={15}/></button>)}'
          new_menu = '{tabs.map(t=><button className={tab===t?"active":""} onClick={()=>choose(t)} key={t}><span className="aiMenuItemIcon">{navIcon[t]}</span><span className="aiMenuItemLabel">{t}</span><ChevronRight size={15}/></button>)}'
          if old_menu in s:
              s = s.replace(old_menu, new_menu, 1)
          p.write_text(s)

          c = Path('app/analytics/analytics.css')
          css = c.read_text()
          extra = '''
/* Financial analysis navigation icons */
.aiMenu button{display:grid;grid-template-columns:30px 1fr 16px;align-items:center;gap:9px;justify-content:initial}
.aiMenuItemIcon{width:30px;height:30px;display:grid;place-items:center;color:#657387}
.aiMenuItemIcon svg{width:25px;height:25px;stroke-width:1.8}
.aiMenuItemLabel{min-width:0}
.aiMenu button.active .aiMenuItemIcon,.aiMenu button:hover .aiMenuItemIcon{color:#1767ff}
'''
          if '/* Financial analysis navigation icons */' not in css:
              c.write_text(css + extra)
          PY
      - name: Commit changes
        run: |
          rm -f .github/workflows/add-menu-icons.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/analytics/page.tsx app/analytics/analytics.css .github/workflows/add-menu-icons.yml
          git diff --cached --quiet && exit 0
          git commit -m "Add icons to financial analysis navigation"
          git push
